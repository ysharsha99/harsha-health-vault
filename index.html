<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{background:#111827;color:#fff;padding:22px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.72;font-size:13px}.wrap{max-width:1150px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:19px;margin-bottom:16px;box-shadow:0 6px 25px #0000000a}.kpi{font-size:28px;font-weight:800;margin-top:6px}.muted{color:#667085;font-size:13px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}.light{background:#eef2f7;color:#172033}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);text-align:center;padding:38px}.logo{width:62px;height:62px;border-radius:17px;background:#111827;color:#fff;display:grid;place-items:center;margin:auto;font-weight:900;font-size:20px}.login button{width:100%;margin-top:18px}.status{padding:11px;border-radius:11px;background:#f8fafc;margin-top:12px;font-size:13px}input,select,textarea{font:inherit}input[type=file]{width:100%;padding:12px;border:1px dashed #cbd5e1;border-radius:11px;background:#fafcff}article{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-top:1px solid #edf0f3}.badge{font-size:11px;background:#ecfdf3;color:#027a48;padding:5px 8px;border-radius:20px;font-weight:800}.pending{background:#fff7ed;color:#9a3412}.error{color:#b42318}.success{color:#027a48}.hidden{display:none}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}.modal .card{width:min(980px,100%);max-height:94vh;overflow:auto}.modal input,.modal select,.modal textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;margin:5px 0 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:9px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.data-table th{background:#f8fafc}.small{font-size:12px}.extractbox{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;max-height:220px;overflow:auto;font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:12px;font-size:13px}.danger{background:#fff1f2;border:1px solid #fecdd3;padding:12px;border-radius:12px;font-size:13px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.two,.three{grid-template-columns:1fr}.top-actions{width:100%}.top-actions button{flex:1}.modal .card{padding:14px}}
</style>

<body><div id="root"></div>
<script>
const SUPABASE_URL="https://dootskjesnsvovtjzvhn.supabase.co";
const SUPABASE_KEY="sb_publishable_6qIdrt7MBTzdu_ArPOYolA_RzSZDZMM";
const DRIVE_FOLDER_ID="1ZOkPEF6oh79ZVmMIcCxamHot41AVJmWR";
const DRIVE_FUNCTION=SUPABASE_URL+"/functions/v1/drive-upload-report";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("root");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const getClientId=()=>localStorage.getItem("hhv_google_client_id")||"";
let currentSession=null; let selectedReportFile=null;

async function login(){const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:"https://ysharsha99.github.io/harsha-health-vault/"}});if(error)alert(error.message)}
async function getSession(){const {data}=await sb.auth.getSession();return data.session}
async function reports(){const {data,error}=await sb.from("health_reports").select("*").order("report_date",{ascending:false}).order("uploaded_at",{ascending:false});if(error)throw error;return data||[]}
function loginView(){root.innerHTML=`<main class="login"><section class="card"><div class="logo">HV</div><h1>Harsha Health Vault</h1><p class="muted">Private lab-report dashboard</p><button class="primary" id="login">Continue with Google</button><div class="status">🔒 Your health records are loaded only after authentication.</div></section></main>`;document.getElementById("login").onclick=login}
async function getDriveToken(){const clientId=getClientId();if(!clientId){settings();throw new Error("Add your Google OAuth Client ID in Drive Setup first.")};if(!window.google?.accounts?.oauth2)throw new Error("Google Drive authorization is still loading. Wait 3 seconds and try again.");return new Promise((resolve,reject)=>{const tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:"https://www.googleapis.com/auth/drive.file",callback:r=>r.error?reject(new Error(r.error_description||r.error)):resolve(r.access_token)});tokenClient.requestAccessToken({prompt:"consent"})})}
async function upload(file){const session=await getSession();if(!session)throw new Error("Please log in again.");const token=await getDriveToken();const fd=new FormData();fd.append("file",file);fd.append("google_access_token",token);fd.append("folder_id",DRIVE_FOLDER_ID);const res=await fetch(DRIVE_FUNCTION,{method:"POST",headers:{Authorization:"Bearer "+session.access_token},body:fd});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||"Drive upload failed");return data}
function settings(){if(document.getElementById("modal"))return;const existing=esc(getClientId());root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><section class="card"><h2>Google Drive Setup</h2><p class="muted">Enter only the OAuth Client ID from your Google Cloud Web application. Never paste the Client Secret here.</p><div class="notice">Use the same Web OAuth Client ID whose redirect URI is <b>https://dootskjesnsvovtjzvhn.supabase.co/auth/v1/callback</b>.</div><input id="cid" value="${existing}" placeholder="xxxx.apps.googleusercontent.com"><div class="actions"><button class="light" id="close">Cancel</button><button class="primary" id="save">Save</button></div></section></div>`);document.getElementById("save").onclick=()=>{const v=document.getElementById("cid").value.trim();if(!v)return alert("Enter your OAuth Client ID.");localStorage.setItem("hhv_google_client_id",v);document.getElementById("modal").remove();alert("Google Client ID saved on this device.")};document.getElementById("close").onclick=()=>document.getElementById("modal").remove()}

async function extractPdf(file,status){const pdfjs=window.pdfjsLib; if(!pdfjs) throw new Error("PDF engine is still loading. Please wait a few seconds and try again.");
 const buf=await file.arrayBuffer();const pdf=await pdfjs.getDocument({data:buf}).promise;let text="";for(let p=1;p<=pdf.numPages;p++){status.textContent=`Reading PDF page ${p} of ${pdf.numPages}…`;const page=await pdf.getPage(p);const tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(" ")+"\n"}return text}
async function extractImage(file,status){status.textContent="Preparing OCR…";if(!window.Tesseract){await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js")};const worker=await Tesseract.createWorker("eng");const result=await worker.recognize(file);await worker.terminate();return result.data.text||""}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error("Could not load OCR engine."));document.head.appendChild(s)})}
function normalizeDate(s){if(!s)return "";let m=s.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](20\d{2})\b/);if(m)return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;m=s.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(20\d{2})\b/i);if(m){const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};return `${m[3]}-${String(months[m[2].slice(0,3).toLowerCase()]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}m=s.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);return m?`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:""}
function parseReport(text,fileName){const lines=text.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);const lower=text.toLowerCase();let date="";for(const key of ["report date","date of report","sample date","collection date","date"]){const re=new RegExp(key.replace(/ /g,"\\s*")+'\\s*[:\-]?\\s*([^|\\n]{6,25})','i');const m=text.match(re);if(m){date=normalizeDate(m[1]);if(date)break}}if(!date)date=normalizeDate(text);
 const provider=(lines.find(x=>/(diagnostic|laborator|labs?|hospital|clinic|health|dental)/i.test(x))||"").slice(0,140);let title=(lines.find(x=>/(complete|comprehensive|cbc|blood|urine|lipid|thyroid|vitamin|dengue|widal|report)/i.test(x))||fileName).slice(0,140);
 const aliases=[
  [/^hemoglobin$|^haemoglobin$|hemoglobin\s*\(hb\)/i,"Hemoglobin","Hematology"],[/^wbc$|white blood cell|total leucocyte|total leukocyte/i,"WBC","Hematology"],[/^rbc$|red blood cell/i,"RBC","Hematology"],[/hematocrit|^hct$/i,"HCT","Hematology"],[/mean corpuscular volume|^mcv$/i,"MCV","Hematology"],[/mean corpuscular hemoglobin|^mch$/i,"MCH","Hematology"],[/mean corpuscular hemoglobin concentration|^mchc$/i,"MCHC","Hematology"],[/platelet|thrombocyte/i,"Platelets","Hematology"],[/^esr$|erythrocyte sedimentation/i,"ESR","Hematology"],[/^neutrophils?$|^poly/i,"Neutrophils","Differential"],[/^lymphocytes?$/i,"Lymphocytes","Differential"],[/^eosinophils?$/i,"Eosinophils","Differential"],[/^monocytes?$/i,"Monocytes","Differential"],[/^basophils?$/i,"Basophils","Differential"],[/hba1c|glycated hemoglobin/i,"HbA1c","Diabetes"],[/random blood sugar|^rbs$|blood glucose/i,"Glucose","Diabetes"],[/^total cholesterol/i,"Total Cholesterol","Lipid Profile"],[/^triglycerides?/i,"Triglycerides","Lipid Profile"],[/^hdl/i,"HDL","Lipid Profile"],[/^ldl/i,"LDL","Lipid Profile"],[/vitamin d/i,"Vitamin D","Vitamins"],[/vitamin b12/i,"Vitamin B12","Vitamins"],[/^tsh|thyroid stimulating/i,"TSH","Thyroid"],[/^t3\b/i,"T3","Thyroid"],[/^t4\b/i,"T4","Thyroid"],[/^creatinine/i,"Creatinine","Kidney"],[/^urea\b/i,"Urea","Kidney"],[/uric acid/i,"Uric Acid","Kidney"],[/^sodium\b/i,"Sodium","Electrolytes"],[/^potassium\b/i,"Potassium","Electrolytes"],[/^calcium\b/i,"Calcium","Electrolytes"],[/^bilirubin total|^total bilirubin/i,"Total Bilirubin","Liver"],[/^ast\b|sgot/i,"AST","Liver"],[/^alt\b|sgpt/i,"ALT","Liver"]
 ];
 const results=[];const seen=new Set();for(const line of lines){let hit=null;for(const [re,name,cat] of aliases){if(re.test(line)){hit={name,cat};break}}if(!hit||seen.has(hit.name))continue;let num=line.match(/(?:^|\s)(-?\d+(?:[,.]\d+)?)(?=\s|$)/);if(!num)num=line.match(/[:=]\s*(-?\d+(?:[,.]\d+)?)/);if(!num)continue;let value=parseFloat(num[1].replace(/,/g,""));let unit="";const after=line.slice((num.index||0)+num[0].length);const um=after.match(/\b(?:g\/dL|mg\/dL|mg\/L|mL\/min\/1\.73m2|million\/Cumm|mill\/mm3|thousand\/Cumm|cells\/cumm|%|fL|pg|IU\/L|U\/L|ng\/mL|mm\/hr|mm\/hr|mEq\/L|mg\/g)\b/i);if(um)unit=um[0];const flag=(/\bhigh\b|\bH\b/i.test(line)?"high":/\blow\b|\bL\b/i.test(line)?"low":"");results.push({test_name:hit.name,category:hit.cat,value_numeric:value,value_text:String(value),unit,reference_low:null,reference_high:null,reference_text:"",flag});seen.add(hit.name)}
 return {report_date:date,provider,title,results,raw:text}}
function rowHtml(r,i){return `<tr data-i="${i}"><td><input class="rn" value="${esc(r.test_name)}"></td><td><input class="rc" value="${esc(r.category||"")}"></td><td><input class="rv" type="number" step="any" value="${r.value_numeric??""}"></td><td><input class="ru" value="${esc(r.unit||"")}"></td><td><input class="rl" type="number" step="any" value="${r.reference_low??""}"></td><td><input class="rh" type="number" step="any" value="${r.reference_high??""}"></td><td><input class="rf" value="${esc(r.flag||"")}"></td><td><button class="light delrow" type="button">Remove</button></td></tr>`}
function reviewModal(parsed,drive,fileName){const rows=parsed.results.length?parsed.results.map(rowHtml).join(""):"";root.insertAdjacentHTML("beforeend",`<div class="modal" id="review"><section class="card"><h2>Review extracted report</h2><div class="notice">The original file is already stored in your private Google Drive. Nothing is saved to the Health Vault database until you press <b>Save Report</b>. Please verify OCR/extracted values before saving.</div><div class="two" style="margin-top:12px"><div><label class="small">Report date</label><input id="rd" type="date" value="${esc(parsed.report_date)}"></div><div><label class="small">Provider / laboratory</label><input id="rp" value="${esc(parsed.provider)}"></div></div><label class="small">Report title</label><input id="rt" value="${esc(parsed.title||fileName)}"><p class="muted">Detected ${parsed.results.length} common lab values. You can add/remove/edit rows.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Test</th><th>Category</th><th>Value</th><th>Unit</th><th>Ref low</th><th>Ref high</th><th>Flag</th><th></th></tr></thead><tbody id="resultRows">${rows||'<tr><td colspan="8" class="muted">No values were confidently detected. You can add them manually.</td></tr>'}</tbody></table></div><div class="actions"><button class="light" id="addrow">+ Add test</button><button class="light" id="cancelreview">Cancel</button><button class="primary" id="savereport">Save Report</button></div><details style="margin-top:12px"><summary class="muted">Show extracted text</summary><div class="extractbox">${esc(parsed.raw.slice(0,20000))}</div></details></section></div>`);document.getElementById("cancelreview").onclick=()=>document.getElementById("review").remove();document.getElementById("addrow").onclick=()=>{const tb=document.getElementById("resultRows");if(tb.querySelector("td[colspan]"))tb.innerHTML="";const tr=document.createElement("tr");tr.innerHTML=rowHtml({test_name:"",category:"",value_numeric:"",unit:"",reference_low:"",reference_high:"",flag:""},0).replace('<tr data-i="0">','<tr>');tb.appendChild(tr)};document.getElementById("resultRows").onclick=e=>{if(e.target.classList.contains("delrow"))e.target.closest("tr").remove()};document.getElementById("savereport").onclick=()=>saveReviewed(drive,fileName)}
async function saveReviewed(drive,fileName){const btn=document.getElementById("savereport");btn.disabled=true;btn.textContent="Saving…";try{const session=await getSession();if(!session)throw new Error("Session expired. Please log in again.");const date=document.getElementById("rd").value;if(!date)throw new Error("Please enter the report date.");const provider=document.getElementById("rp").value.trim();const title=document.getElementById("rt").value.trim()||fileName;const rows=[...document.querySelectorAll("#resultRows tr")].map(tr=>{const q=s=>tr.querySelector(s)?.value.trim()||"";const v=q(".rv");return {test_name:q(".rn"),category:q(".rc")||null,value_numeric:v===""?null:Number(v),value_text:v||null,unit:q(".ru")||null,reference_low:q(".rl")===""?null:Number(q(".rl")),reference_high:q(".rh")===""?null:Number(q(".rh")),reference_text:null,flag:q(".rf")||null,owner_id:session.user.id}}).filter(r=>r.test_name);
 await sb.from("health_reports").update({is_current:false}).eq("owner_id",session.user.id);const {data:report,error}=await sb.from("health_reports").insert({report_date:date,provider,report_title:title,source_file_name:fileName,google_drive_file_id:drive?.file?.id||drive?.id||null,google_drive_url:drive?.file?.webViewLink||drive?.file?.webContentLink||drive?.webViewLink||null,is_current:true,extraction_status:"reviewed",owner_id:session.user.id}).select().single();if(error)throw error;if(rows.length){const {error:e2}=await sb.from("test_results").insert(rows.map(r=>({...r,report_id:report.id})));if(e2){await sb.from("health_reports").delete().eq("id",report.id);throw e2}}document.getElementById("review").remove();alert(`Report saved successfully with ${rows.length} test values.`);app()}catch(e){alert(e.message||"Could not save report.");btn.disabled=false;btn.textContent="Save Report"}}
async function processFile(file,st){if(!file) return;if(file.size>20*1024*1024)throw new Error("Please use a file smaller than 20 MB.");st.textContent="Uploading original to private Google Drive…";const drive=await upload(file);st.textContent="Original stored. Extracting report text…";let text="";if(file.type==="application/pdf"||/\.pdf$/i.test(file.name))text=await extractPdf(file,st);else text=await extractImage(file,st);if(!text.trim())throw new Error("No readable text was detected. The original is safely stored in Drive, but this file needs manual entry/OCR review.");const parsed=parseReport(text,file.name);st.textContent=`Extraction complete: ${parsed.results.length} values detected. Opening review…`;setTimeout(()=>reviewModal(parsed,drive,file.name),200)}
async function app(){currentSession=await getSession();if(!currentSession){loginView();return}let rs=[];try{rs=await reports()}catch(e){root.innerHTML=`<main class="wrap"><section class="card"><h2>Health Vault</h2><p class="error">${esc(e.message)}</p></section></main>`;return}const cur=rs.find(x=>x.is_current);root.innerHTML=`<header><div><h1>Harsha Health Vault</h1><p>Private • authenticated account</p></div><div class="top-actions"><button class="light" id="settings">Drive Setup</button><button class="light" id="logout">Logout</button></div></header><main class="wrap"><div class="grid"><div class="card"><div class="muted">Reports</div><div class="kpi">${rs.length}</div></div><div class="card"><div class="muted">Current report</div><div class="kpi">${esc(cur?.report_date||"—")}</div></div><div class="card"><div class="muted">Original storage</div><div class="kpi">Google Drive</div></div></div><section class="card"><h2>Upload New Report</h2><p class="muted">PDF, JPG or PNG. The original is stored in your private Google Drive, then the browser extracts text/OCR and asks you to review values before saving them to the database.</p><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png,image/*" aria-label="Choose medical report PDF or image" style="display:block;width:100%;min-height:52px;padding:12px;border:2px dashed #2563eb;border-radius:12px;background:#f8fbff;font-size:16px;cursor:pointer"><button id="modernPicker" class="light" type="button" style="margin-top:10px;width:100%;min-height:48px">📄 Select Report (mobile picker)</button><div id="selectedFile" class="status" style="margin-top:10px">No file selected. Tap Choose file and select a PDF, JPG or PNG from your device.</div><div class="actions" style="justify-content:flex-start"><button class="primary" id="uploadbtn" type="button" disabled>Upload & Extract Report</button></div><div id="upstatus" class="status">Ready. Select a report above.</div></section><section class="card"><h2>Report History</h2>${rs.map(r=>`<article><div><strong>${esc(r.report_date)}</strong> ${r.is_current?'<span class="badge">CURRENT</span>':''}<br><span class="muted">${esc(r.provider||"Provider not recorded")}</span></div><span class="muted">${esc(r.extraction_status||"pending")}</span></article>`).join("")||"<p class='muted'>No reports yet.</p>"}</section></main>`;document.getElementById("logout").onclick=()=>sb.auth.signOut();document.getElementById("settings").onclick=settings;const fi=document.getElementById("file"),ub=document.getElementById("uploadbtn");const showSelected=()=>{const f=(fi.files && fi.files.length ? fi.files[0] : null);if(f) selectedReportFile=f;const activeFile=selectedReportFile||f;const sf=document.getElementById("selectedFile");if(activeFile){ub.disabled=false;sf.innerHTML=`<strong>✓ File selected</strong><br>${esc(activeFile.name)}<br><span class="muted">${(activeFile.size/1024/1024).toFixed(2)} MB • ${esc(activeFile.type||"file")}</span>`;document.getElementById("upstatus").textContent="File is ready. Tap Upload & Extract Report."}else{ub.disabled=true;sf.textContent="No file selected. Tap Choose file and select a PDF, JPG or PNG from your device.";document.getElementById("upstatus").textContent="Ready. Select a report above."}};fi.addEventListener("change",showSelected,false);fi.addEventListener("input",showSelected,false);fi.addEventListener("cancel",()=>{document.getElementById("upstatus").textContent="File picker closed. No file was selected."},false);document.getElementById("modernPicker").onclick=async()=>{const st=document.getElementById("upstatus");try{if(!window.showOpenFilePicker){st.textContent="Mobile picker fallback is not available in this browser. Use Choose file above.";fi.click();return}const handles=await window.showOpenFilePicker({multiple:false,types:[{description:"Medical report",accept:{"application/pdf":[".pdf"],"image/jpeg":[".jpg",".jpeg"],"image/png":[".png"]}}]});if(!handles.length)return;selectedReportFile=await handles[0].getFile();showSelected();}catch(e){if(e?.name==="AbortError"){st.textContent="File picker closed. No file selected."}else{st.textContent="Could not open the mobile picker: "+(e.message||e)}}};ub.onclick=async()=>{const f=selectedReportFile || (fi.files && fi.files.length ? fi.files[0] : null);if(!f){document.getElementById("upstatus").textContent="Please choose a report first.";return}ub.disabled=true;const st=document.getElementById("upstatus");try{await processFile(f,st)}catch(err){st.innerHTML='<span class="error">'+esc(err.message)+"</span>";ub.disabled=false}}}
sb.auth.onAuthStateChange((event)=>{if(event === "SIGNED_OUT") setTimeout(app,0)});app();
</script>
