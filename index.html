gn-items:center;padding:5px 9px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:800}.pill.good{background:#ecfdf3;color:#027a48}.pill.warn{background:#fffaeb;color:#b54708}.pill.bad{background:#fff1f2;color:#b42318}.pill.neutral{background:#eef2f7;color:#475467}.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.result{border:1px solid #e6eaf0;border-radius:15px;padding:14px;background:#fff}.result-top{display:flex;justify-content:space-between;gap:10px}.value{font-size:23px;font-weight:850;margin-top:7px}.ref{font-size:11px;color:#667085;margin-top:4px}.trend{font-size:11px;font-weight:800;margin-top:8px}.trend.up{color:#027a48}.trend.down{color:#b42318}.trend.flat{color:#667085}.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.data-table th{background:#f8fafc}.chart-card{overflow:hidden}.chart{width:100%;height:250px;display:block}.chart-empty{height:250px;display:grid;place-items:center;color:#667085;font-size:13px;background:#fafbfc;border-radius:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.insight{border-left:4px solid #2563eb;background:#f8fafc;padding:13px;border-radius:10px;margin-bottom:9px;font-size:13px;line-height:1.55}.insight strong{display:block;margin-bottom:3px}.report-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #edf0f3}.report-row:first-child{border-top:0}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}input,select,textarea{font:inherit}input[type=file]{width:100%;padding:12px;border:1px dashed #cbd5e1;border-radius:11px;background:#fafcff}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}.modal .card{width:min(1000px,100%);max-height:94vh;overflow:auto}.modal input,.modal select,.modal textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;margin:5px 0 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.extractbox{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;max-height:220px;overflow:auto;font-size:12px}.empty{padding:28px;text-align:center;color:#667085}.category-nav{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:12px}.category-nav button.active{background:#111827;color:#fff}.timeline{position:relative;margin-left:8px}.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#e5e7eb}.timeline-item{position:relative;padding:0 0 18px 28px}.timeline-dot{position:absolute;left:1px;top:3px;width:14px;height:14px;border-radius:50%;background:#2563eb;border:3px solid #dbeafe}.footer-note{font-size:11px;color:#667085;line-height:1.5;padding:8px 2px 30px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}.top-actions{width:100%}.top-actions button{flex:1}.card{padding:15px}.result-grid{grid-template-columns:1fr}.value{font-size:21px}}

async function login(){const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:"https://ysharsha99.github.io/harsha-health-vault/"}});if(error)alert(error.message)}
async function getSession(){const {data}=await sb.auth.getSession();return data.session}

async function getDriveToken(){const clientId=getClientId();if(!clientId){settings();throw new Error("Add your Google OAuth Client ID in Drive Setup first.")};return new Promise((resolve,reject)=>{if(!window.google?.accounts?.oauth2)return reject(new Error("Google authorization is still loading. Please wait a few seconds."));const tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:"https://www.googleapis.com/auth/drive.file",callback:r=>r.error?reject(new Error(r.error_description||r.error)):resolve(r.access_token)});tokenClient.requestAccessToken({prompt:"consent"})})}
async function upload(file){const session=await getSession();if(!session)throw new Error("Please log in again.");const token=await getDriveToken();const fd=new FormData();fd.append("file",file);fd.append("google_access_token",token);fd.append("folder_id",DRIVE_FOLDER_ID);const res=await fetch(DRIVE_FUNCTION,{method:"POST",headers:{Authorization:"Bearer "+session.access_token},body:fd});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||"Drive upload failed");return data}
function settings(){if(document.getElementById("modal"))return;const existing=esc(getClientId());root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><section class="card"><h2>Google Drive Setup</h2><p class="muted">Enter only the OAuth Client ID from your Google Cloud Web application. Never paste the Client Secret here.</p><input id="cid" value="${existing}" placeholder="xxxx.apps.googleusercontent.com"><div class="actions"><button class="light" id="close">Cancel</button><button class="primary" id="save">Save</button></div></section></div>`);document.getElementById("save").onclick=()=>{const v=document.getElementById("cid").value.trim();if(!v)return alert("Enter your OAuth Client ID.");localStorage.setItem("hhv_google_client_id",v);document.getElementById("modal").remove();alert("Google Client ID saved on this device.")};document.getElementById("close").onclick=()=>document.getElementById("modal").remove()}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error("Could not load OCR engine."));document.head.appendChild(s)})}
async function extractPdf(file,status){
  const pdfjs=window.pdfjsLib;if(!pdfjs)throw new Error("PDF engine is still loading. Please wait a few seconds and try again.");
  const buf=await file.arrayBuffer();const pdf=await pdfjs.getDocument({data:buf}).promise;let pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    status.textContent=`Reading PDF page ${p} of ${pdf.numPages}…`;
    const page=await pdf.getPage(p);const tc=await page.getTextContent();
    const items=tc.items.map(x=>({str:x.str||"",x:x.transform?.[4]||0,y:x.transform?.[5]||0,w:x.width||0})).filter(x=>x.str.trim());
    items.sort((a,b)=>Math.abs(a.y-b.y)>3?b.y-a.y:a.x-b.x);
    const lines=[];
    for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<=3);if(!line){line={y:it.y,items:[]};lines.push(line)}line.items.push(it)}
    lines.sort((a,b)=>b.y-a.y);
    pages.push(lines.map(l=>l.items.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" ")).join("\n"));
  }
  return pages.join("\n\n--- PAGE BREAK ---\n\n");
}
async function extractImage(file,status){status.textContent="Preparing OCR…";if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");const worker=await Tesseract.createWorker("eng");const result=await worker.recognize(file);await worker.terminate();return result.data.text||""}
function normalizeDate(s){if(!s)return "";let m=s.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](20\d{2})\b/);if(m)return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;m=s.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(20\d{2})\b/i);if(m){const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};return `${m[3]}-${String(months[m[2].slice(0,3).toLowerCase()]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}m=s.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);return m?`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:""}
function parseReport(text,fileName){
  const lines=text.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  let date="";
  const datePatterns=[/\b(?:report|registration|sample|collection|test|drawn|investigation)\s*date\s*[:\-]?\s*(\d{1,2}[\/-]\d{1,2}[\/-]20\d{2})/i,/\b(\d{1,2}[\/-]\d{1,2}[\/-]20\d{2})\b/];
  for(const re of datePatterns){const m=text.match(re);if(m){date=normalizeDate(m[1]);if(date)break}}
  if(!date)date=normalizeDate(text);
  const provider=(lines.find(x=>/(diagnostic|laborator|\blabs?\b|hospital|clinic|dental|healthcare)/i.test(x)&&!/(page \d+\/\d+)/i.test(x))||"").slice(0,160);
  const title=(lines.find(x=>/\b(complete|comprehensive|cbc|blood|urine|lipid|thyroid|vitamin|dengue|widal|coagulation|report)\b/i.test(x)&&x.length<180)||fileName).slice(0,160);
  const aliases=[
    [/\bhemoglobin\b|\bhaemoglobin\b|\bhb\b/i,"Hemoglobin","Hematology",/\b(?:g\s*\/?\s*dL)\b/i],
    [/\b(?:wbc|total leucocyte count|total leukocyte count|white blood cell(?: count)?)\b/i,"WBC","Hematology",/\b(?:cells?\s*\/?\s*cumm|\/cumm|thousand\s*\/?\s*cumm|\/mm3)\b/i],
    [/\b(?:rbc|red blood cell(?: count)?)\b/i,"RBC","Hematology",/\b(?:million\s*\/?\s*cumm|mill\s*\/?\s*mm3|\/cumm|\/mm3)\b/i],
    [/\b(?:hematocrit|haematocrit|hct)\b/i,"HCT","Hematology",/\b%\b|%/i],
    [/\b(?:mean corpuscular volume|mcv)\b/i,"MCV","Hematology",/\bfL\b/i],
    [/\b(?:mean corpuscular hemoglobin|mch)\b/i,"MCH","Hematology",/\bpg\b/i],
    [/\b(?:mean corpuscular hemoglobin concentration|mchc)\b/i,"MCHC","Hematology",/%|\bg\s*\/?\s*dL\b/i],
    [/\b(?:platelets?|platelet count|thrombocytes?)\b/i,"Platelets","Hematology",/\b(?:cells?\s*\/?\s*cumm|\/cumm|thousand\s*\/?\s*cumm|\/mm3)\b/i],
    [/\b(?:esr|erythrocyte sedimentation rate)\b/i,"ESR","Hematology",/\bmm\s*\/?\s*hr\b/i],
    [/\b(?:neutrophils?|polymorphs?|poly)\b/i,"Neutrophils","Differential",/%/i],
    [/\b(?:lymphocytes?)\b/i,"Lymphocytes","Differential",/%/i],
    [/\b(?:eosinophils?)\b/i,"Eosinophils","Differential",/%/i],
    [/\b(?:monocytes?)\b/i,"Monocytes","Differential",/%/i],
    [/\b(?:basophils?)\b/i,"Basophils","Differential",/%/i],
    [/\b(?:hba1c|glycated hemoglobin)\b/i,"HbA1c","Diabetes",/%/i],
    [/\b(?:random blood sugar|rbs|blood glucose|glucose)\b/i,"Glucose","Diabetes",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\btotal cholesterol\b/i,"Total Cholesterol","Lipid Profile",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\btriglycerides?\b/i,"Triglycerides","Lipid Profile",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\bhdl(?:\s*cholesterol)?\b/i,"HDL","Lipid Profile",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\bldl(?:\s*cholesterol)?\b/i,"LDL","Lipid Profile",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\bvitamin\s*d\b/i,"Vitamin D","Vitamins",/\b(?:ng\s*\/?\s*mL|nmol\s*\/?\s*L)\b/i],
    [/\bvitamin\s*b12\b/i,"Vitamin B12","Vitamins",/\b(?:pg\s*\/?\s*mL)\b/i],
    [/\b(?:tsh|thyroid stimulating hormone)\b/i,"TSH","Thyroid",/\b(?:u?iu\s*\/?\s*mL|mIU\s*\/?\s*L)\b/i],
    [/\b(?:t3|triiodothyronine)\b/i,"T3","Thyroid",null],[/\b(?:t4|thyroxine)\b/i,"T4","Thyroid",null],
    [/\bcreatinine\b/i,"Creatinine","Kidney",/\b(?:mg\s*\/?\s*dL)\b/i],[/\burea\b/i,"Urea","Kidney",/\b(?:mg\s*\/?\s*dL)\b/i],[/\buric acid\b/i,"Uric Acid","Kidney",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\bsodium\b/i,"Sodium","Electrolytes",/\bmEq\s*\/?\s*L\b/i],[/\bpotassium\b/i,"Potassium","Electrolytes",/\bmEq\s*\/?\s*L\b/i],[/\bcalcium\b/i,"Calcium","Electrolytes",/\b(?:mg\s*\/?\s*dL)\b/i],
    [/\b(?:total bilirubin|bilirubin total)\b/i,"Total Bilirubin","Liver",/\b(?:mg\s*\/?\s*dL)\b/i],[/\b(?:ast|sgot)\b/i,"AST","Liver",/\b(?:u\s*\/?\s*l|iu\s*\/?\s*l)\b/i],[/\b(?:alt|sgpt)\b/i,"ALT","Liver",/\b(?:u\s*\/?\s*l|iu\s*\/?\s*l)\b/i]
  ];
  const badNumber=/^(?:0?\d{1,2}\d{4,}|\d{5,}|\d{1,4}\.\d{4,})$/;
  const cleanNums=str=>{const ms=[...str.matchAll(/-?\d+(?:[,.]\d+)?/g)];return ms.map(m=>({n:parseFloat(m[0].replace(/,/g,"")),raw:m[0],idx:m.index||0})).filter(x=>Number.isFinite(x.n)&&!badNumber.test(x.raw.replace(/,/g,"")))};
  const results=[];const seen=new Set();
  for(let i=0;i<lines.length;i++){const line=lines[i];
    for(const [re,name,cat,unitRe] of aliases){if(seen.has(name)||!re.test(line))continue;
      const candidates=[];
      for(const candidateLine of [line,lines[i+1]||"",lines[i+2]||""]){if(!candidateLine)continue;const nums=cleanNums(candidateLine);for(const z of nums)candidates.push({line:candidateLine,...z})}
      if(!candidates.length)continue;
      // Prefer a number close to the test name, then a number with a plausible lab unit. Ignore page counts, phone numbers and IDs.
      const chosen=candidates.find(c=>unitRe&&unitRe.test(c.line))||candidates[0];
      if(chosen.n>100000||chosen.n<0)continue;
      let unit="";const um=chosen.line.match(/\b(?:g\s*\/?\s*dL|mg\s*\/?\s*dL|mg\s*\/?\s*L|mL\s*\/?\s*min(?:\/1\.73m2)?|million\s*\/?\s*cumm|mill\s*\/?\s*mm3|thousand\s*\/?\s*cumm|cells?\s*\/?\s*cumm|fL|pg|IU\s*\/?\s*L|uIU\s*\/?\s*mL|mIU\s*\/?\s*L|ng\s*\/?\s*mL|nmol\s*\/?\s*L|mm\s*\/?\s*hr|mEq\s*\/?\s*L|%)\b/i);if(um)unit=um[0];
      let flag="";if(/\b(?:high|H)\b/i.test(chosen.line))flag="high";else if(/\b(?:low|L)\b/i.test(chosen.line))flag="low";
      // If the extracted number is clearly a page/phone/identifier, skip it rather than creating false health data.
      if((name==="HbA1c"&&chosen.n>20)||(name==="Vitamin D"&&chosen.n>500)||(name==="TSH"&&chosen.n>100)||(name==="ESR"&&chosen.n>200))continue;
      results.push({test_name:name,category:cat,value_numeric:chosen.n,value_text:String(chosen.n),unit,reference_low:null,reference_high:null,reference_text:"",flag});seen.add(name);break;
    }
  }
  return {report_date:date,provider,title,results,raw:text};
}
function rowHtml(r){return `<tr><td><input class="rn" value="${esc(r.test_name)}"></td><td><input class="rc" value="${esc(r.category||"")}"></td><td><input class="rv" type="number" step="any" value="${r.value_numeric??""}"></td><td><input class="ru" value="${esc(r.unit||"")}"></td><td><input class="rl" type="number" step="any" value="${r.reference_low??""}"></td><td><input class="rh" type="number" step="any" value="${r.reference_high??""}"></td><td><input class="rf" value="${esc(r.flag||"")}"></td><td><button class="light delrow" type="button">Remove</button></td></tr>`}
function reviewModal(parsed,drive,fileName){const rows=parsed.results.map(rowHtml).join("");root.insertAdjacentHTML("beforeend",`<div class="modal" id="review"><section class="card"><h2>Review extracted report</h2><div class="notice">The original file is stored in your private Google Drive. Nothing is saved to the Health Vault database until you press <b>Save Report</b>. Please verify extracted values.</div><div class="two" style="margin-top:12px"><div><label class="small">Report date</label><input id="rd" type="date" value="${esc(parsed.report_date)}"></div><div><label class="small">Provider / laboratory</label><input id="rp" value="${esc(parsed.provider)}"></div></div><label class="small">Report title</label><input id="rt" value="${esc(parsed.title||fileName)}"><p class="muted">Detected ${parsed.results.length} common lab values. Add/remove/edit rows as needed.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Test</th><th>Category</th><th>Value</th><th>Unit</th><th>Ref low</th><th>Ref high</th><th>Flag</th><th></th></tr></thead><tbody id="resultRows">${rows||"<tr><td colspan='8' class='muted'>No values detected. Add them manually.</td></tr>"}</tbody></table></div><div class="actions"><button class="light" id="addrow">+ Add test</button><button class="light" id="cancelreview">Cancel</button><button class="primary" id="savereport">Save Report</button></div><details style="margin-top:12px"><summary class="muted">Show extracted text</summary><div class="extractbox">${esc(parsed.raw.slice(0,20000))}</div></details></section></div>`);document.getElementById("cancelreview").onclick=()=>document.getElementById("review").remove();document.getElementById("addrow").onclick=()=>{const tb=document.getElementById("resultRows");if(tb.querySelector("td[colspan]"))tb.innerHTML="";const tr=document.createElement("tr");tr.innerHTML=rowHtml({test_name:"",category:"",value_numeric:"",unit:"",reference_low:"",reference_high:"",flag:""});tb.appendChild(tr)};document.getElementById("resultRows").onclick=e=>{if(e.target.classList.contains("delrow"))e.target.closest("tr").remove()};document.getElementById("savereport").onclick=()=>saveReviewed(drive,fileName)}
async function saveReviewed(drive,fileName){const btn=document.getElementById("savereport");btn.disabled=true;btn.textContent="Saving…";try{const session=await getSession();if(!session)throw new Error("Session expired. Please log in again.");const date=document.getElementById("rd").value;if(!date)throw new Error("Please enter the report date.");const provider=document.getElementById("rp").value.trim();const title=document.getElementById("rt").value.trim()||fileName;const rows=[...document.querySelectorAll("#resultRows tr")].map(tr=>{const q=s=>tr.querySelector(s)?.value.trim()||"";const v=q(".rv");return {test_name:q(".rn"),category:q(".rc")||null,value_numeric:v===""?null:Number(v),value_text:v||null,unit:q(".ru")||null,reference_low:q(".rl")===""?null:Number(q(".rl")),reference_high:q(".rh")===""?null:Number(q(".rh")),reference_text:null,flag:q(".rf")||null,owner_id:session.user.id}}).filter(r=>r.test_name);await sb.from("health_reports").update({is_current:false}).eq("owner_id",session.user.id);const {data:report,error}=await sb.from("health_reports").insert({report_date:date,provider,report_title:title,source_file_name:fileName,google_drive_file_id:drive?.file?.id||drive?.id||null,google_drive_url:drive?.file?.webViewLink||drive?.file?.webContentLink||drive?.webViewLink||null,is_current:true,extraction_status:"reviewed",owner_id:session.user.id}).select().single();if(error)throw error;if(rows.length){const {error:e2}=await sb.from("test_results").insert(rows.map(r=>({...r,report_id:report.id})));if(e2){await sb.from("health_reports").delete().eq("id",report.id);throw e2}}document.getElementById("review").remove();await app();alert(`Report saved successfully with ${rows.length} test values.`)}catch(e){alert(e.message||"Could not save report.");btn.disabled=false;btn.textContent="Save Report"}}
async function processFile(file,st){if(!file)return;if(file.size>20*1024*1024)throw new Error("Please use a file smaller than 20 MB.");st.textContent="Uploading original to private Google Drive…";const drive=await upload(file);st.textContent="Original stored. Extracting report text…";let text="";if(file.type==="application/pdf"||/\.pdf$/i.test(file.name))text=await extractPdf(file,st);else text=await extractImage(file,st);if(!text.trim())throw new Error("No readable text was detected. The original is safely stored in Drive, but this file needs manual entry/OCR review.");const parsed=parseReport(text,file.name);st.textContent=`Extraction complete: ${parsed.results.length} values detected. Opening review…`;setTimeout(()=>reviewModal(parsed,drive,file.name),200)}

function reportMap(){return Object.fromEntries(state.reports.map(r=>[r.id,r]))}
function dateLabel(d){if(!d)return "Unknown date";return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function resultStatus(r){if(r.flag){const f=String(r.flag).toLowerCase();if(f.includes("high")||f==="h")return ["High","bad"];if(f.includes("low")||f==="l")return ["Low","bad"]}if(r.reference_low!==null&&r.reference_low!==undefined&&r.value_numeric<r.reference_low)return ["Low","bad"];if(r.reference_high!==null&&r.reference_high!==undefined&&r.value_numeric>r.reference_high)return ["High","bad"];if(r.reference_low!==null||r.reference_high!==null)return ["Within range","good"];return ["Reference not saved","neutral"]}
function latestByName(){const rm=reportMap();const arr=state.results.slice().sort((a,b)=>String(rm[b.report_id]?.report_date||"").localeCompare(String(rm[a.report_id]?.report_date||"")));const m={};for(const r of arr){if(!m[r.test_name])m[r.test_name]=r}return m}
function historyFor(name){const rm=reportMap();return state.results.filter(r=>r.test_name===name&&rm[r.report_id]).sort((a,b)=>String(rm[a.report_id].report_date).localeCompare(String(rm[b.report_id].report_date))).map(r=>({...r,date:rm[r.report_id].report_date}))}
function trendFor(h){if(h.length<2)return ["","flat"];const a=Number(h[h.length-2].value_numeric),b=Number(h[h.length-1].value_numeric);if(!Number.isFinite(a)||!Number.isFinite(b))return ["","flat"];const pct=a===0?0:((b-a)/Math.abs(a))*100;return [pct>1?`↑ ${Math.abs(pct).toFixed(1)}%`:pct<-1?`↓ ${Math.abs(pct).toFixed(1)}%`:"→ stable",pct>1?"up":pct<-1?"down":"flat"]}
function displayValue(r){return `${fmt(r.value_numeric)}${r.unit?" "+esc(r.unit):""}`}
function overview(){const latest=latestByName(), names=Object.keys(latest);const flagged=names.map(n=>latest[n]).filter(r=>resultStatus(r)[1]==="bad");const cats=[...new Set(names.map(n=>latest[n].category||"Other"))].sort((a,b)=>categoryOrder.indexOf(a)-categoryOrder.indexOf(b));return `<section class="grid"><div class="card"><div class="muted">Reports</div><div class="kpi">${state.reports.length}</div><div class="small muted">Stored in your private account</div></div><div class="card"><div class="muted">Latest tests</div><div class="kpi">${names.length}</div><div class="small muted">Unique tests with saved values</div></div><div class="card"><div class="muted">Categories</div><div class="kpi">${cats.length}</div><div class="small muted">Across your history</div></div><div class="card"><div class="muted">Latest report</div><div class="kpi">${dateLabel(state.reports[0]?.report_date).replace(/ /g," ")}</div><div class="small muted">Most recent uploaded report</div></div></section><section class="card"><div class="section-title"><div><h2>💡 Health Insights</h2><div class="muted">Automated observations from values saved in your Vault — not a diagnosis.</div></div></div>${insightsHtml().join("")||'<div class="empty">Add more reports to generate historical insights.</div>'}</section><section class="card"><div class="section-title"><div><h2>Latest Results</h2><div class="muted">The newest saved value for each test.</div></div><button class="light" onclick="setTab('results')">View all</button></div><div class="result-grid">${names.slice(0,12).map(resultCard).join("")||'<div class="empty">No test results saved yet.</div>'}</div></section><section class="card"><div class="section-title"><div><h2>📈 Key Trends</h2><div class="muted">Tests with at least two saved measurements.</div></div><button class="light" onclick="setTab('trends')">Open Trends</button></div>${trendCards(names.filter(n=>historyFor(n).length>=2).slice(0,4)).join("")||'<div class="empty">Upload another report containing the same tests to start trend charts.</div>'}</section>`}
function resultCard(r){const [s,c]=resultStatus(r),h=historyFor(r.test_name),[tr,tc]=trendFor(h);return `<div class="result"><div class="result-top"><div><strong>${esc(r.test_name)}</strong><div class="muted">${esc(r.category||"Other")}</div></div><span class="pill ${c}">${s}</span></div><div class="value">${displayValue(r)}</div><div class="ref">${r.reference_low!==null||r.reference_high!==null?`Reference: ${fmt(r.reference_low)} – ${fmt(r.reference_high)} ${esc(r.unit||"")}`:"Reference range was not saved with this result."}</div>${tr?`<div class="trend ${tc}">${tr} vs previous saved result</div>`:""}</div>`}
function insightsHtml(){const latest=latestByName(), out=[];const add=(title,text)=>out.push(`<div class="insight"><strong>${esc(title)}</strong>${text}</div>`);const p=latest["Platelets"];if(p){const h=historyFor("Platelets");if(h.length>=2){const vals=h.map(x=>`${dateLabel(x.date)}: ${fmt(x.value_numeric)} ${x.unit||""}`);add("Platelet history",`${esc(vals.join(" → "))}. The latest saved value is ${esc(fmt(p.value_numeric)+" "+(p.unit||""))}. Status is based on the report reference range/flag when available.`)}else add("Platelets",`Latest saved value: ${esc(displayValue(p))}. Add earlier reports to see the historical change.`)}const m=latest["MCV"], mch=latest["MCH"], mchc=latest["MCHC"];if(m||mch||mchc){const parts=[m&&`MCV ${fmt(m.value_numeric)} ${m.unit||""}`,mch&&`MCH ${fmt(mch.value_numeric)} ${mch.unit||""}`,mchc&&`MCHC ${fmt(mchc.value_numeric)} ${mchc.unit||""}`].filter(Boolean);add("Red-cell indices",`Latest saved indices: ${esc(parts.join(", "))}. Compare them with the reference ranges printed on the corresponding report; persistent out-of-range values are worth discussing with a clinician.`)}const a=latest["HbA1c"];if(a)add("HbA1c",`Latest saved HbA1c: ${esc(displayValue(a))}. The dashboard reports the laboratory value and trend; it does not diagnose diabetes or prediabetes.`);const d=latest["Vitamin D"];if(d)add("Vitamin D",`Latest saved Vitamin D: ${esc(displayValue(d))}. Use the reference interval from the report when interpreting the flag.`);const w=latest["WBC"];if(w&&historyFor("WBC").length>=2){const h=historyFor("WBC"),[tr]=trendFor(h);add("WBC trend",`Latest WBC is ${esc(displayValue(w))}; recent history shows ${esc(tr||"a change")} compared with the previous saved result.`)}if(!out.length)add("No insights yet","Save at least one report with test values. Historical comparisons become more useful after multiple reports.");return out}
function trendCards(names){return names.map(n=>{const h=historyFor(n);return `<div class="card chart-card" style="margin-bottom:12px"><div class="section-title"><div><h3>${esc(n)}</h3><div class="muted">${esc(h[0].unit||"")}</div></div><span class="pill neutral">${h.length} measurements</span></div>${svgChart(h)}</div>`})}
function svgChart(h){if(h.length<2)return `<div class="chart-empty">Need at least 2 saved measurements.</div>`;const vals=h.map(x=>Number(x.value_numeric));const finite=vals.filter(Number.isFinite);if(!finite.length)return `<div class="chart-empty">No numeric values available.</div>`;let min=Math.min(...finite),max=Math.max(...finite);if(min===max){min-=1;max+=1}const W=900,H=230,P=38;const pts=h.map((x,i)=>{const v=Number(x.value_numeric);const x0=P+(i/(h.length-1))*(W-P*2);const y=H-P-((v-min)/(max-min))*(H-P*2);return [x0,y,v,x.date]}).filter(p=>Number.isFinite(p[2]));const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="38" y1="192" x2="862" y2="192" stroke="#d0d5dd"/><line x1="38" y1="38" x2="38" y2="192" stroke="#d0d5dd"/><path d="${path}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#2563eb"><title>${esc(dateLabel(p[3]))}: ${esc(fmt(p[2]))}</title></circle>`).join("")}<text x="44" y="25" font-size="12" fill="#667085">${esc(fmt(max))}</text><text x="44" y="215" font-size="12" fill="#667085">${esc(fmt(min))}</text></svg><div class="legend"><span class="small">Latest: <b>${esc(fmt(pts[pts.length-1][2]))}</b></span><span class="small">${esc(dateLabel(pts[0][3]))} → ${esc(dateLabel(pts[pts.length-1][3]))}</span></div>`}
function resultsTab(){const latest=latestByName();const cats=["All",...categoryOrder.filter(c=>Object.values(latest).some(r=>(r.category||"Other")===c))];const names=Object.keys(latest).filter(n=>state.category==="All"||(latest[n].category||"Other")===state.category).sort();return `<section class="card"><div class="section-title"><div><h2>🧪 Results</h2><div class="muted">Latest value per test, with the saved report reference range when available.</div></div></div><div class="category-nav">${cats.map(c=>`<button class="light ${state.category===c?"active":""}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`).join("")}</div><div class="result-grid">${names.map(resultCard).join("")||'<div class="empty">No results in this category.</div>'}</div></section>`}
function trendsTab(){const names=[...new Set(state.results.map(r=>r.test_name))].filter(n=>historyFor(n).length>=2).sort();return `<section class="card"><div class="section-title"><div><h2>📈 Trends</h2><div class="muted">Historical measurements are ordered by report date.</div></div></div>${trendCards(names).join("")||'<div class="empty">No repeated tests yet. Upload another report with overlapping tests to build trends.</div>'}</section>`}
function reportsTab(){return `<section class="card"><div class="section-title"><div><h2>📋 Reports</h2><div class="muted">Original files remain in your private Google Drive.</div></div></div>${state.reports.map((r,i)=>`<div class="report-row"><div><strong>${esc(dateLabel(r.report_date))}</strong> ${r.is_current?'<span class="pill good">CURRENT</span>':''}<br><span class="muted">${esc(r.report_title||r.source_file_name||"Report")} · ${esc(r.provider||"Provider not recorded")}</span><br><span class="small muted">${state.results.filter(x=>x.report_id===r.id).length} saved values · ${esc(r.extraction_status||"pending")}</span></div><div class="top-actions"><button class="light" onclick="showReport('${esc(r.id)}')">Details</button>${r.google_drive_url?`<button class="light" onclick="window.open('${esc(r.google_drive_url)}','_blank')">Open original</button>`:""}</div></div>`).join("")||'<div class="empty">No reports yet.</div>'}</section>`}
function timeline(){const sorted=state.reports.slice().sort((a,b)=>String(a.report_date).localeCompare(String(b.report_date)));return `<section class="card"><div class="section-title"><div><h2>🗓 Timeline</h2><div class="muted">Your report history in chronological order.</div></div></div><div class="timeline">${sorted.map(r=>`<div class="timeline-item"><span class="timeline-dot"></span><strong>${esc(dateLabel(r.report_date))}</strong>${r.is_current?' <span class="pill good">CURRENT</span>':''}<br><span class="muted">${esc(r.report_title||r.source_file_name||"Report")} · ${esc(r.provider||"Provider not recorded")}</span></div>`).join("")||'<div class="empty">No reports yet.</div>'}</div></section>`}
function showReport(id){const r=state.reports.find(x=>x.id===id);if(!r)return;const rows=state.results.filter(x=>x.report_id===id);root.insertAdjacentHTML("beforeend",`<div class="modal" id="detail"><section class="card"><div class="section-title"><div><h2>${esc(r.report_title||"Report")}</h2><div class="muted">${esc(dateLabel(r.report_date))} · ${esc(r.provider||"Provider not recorded")}</div></div><button class="light" id="closedetail">Close</button></div><div class="grid"><div><div class="muted">Values</div><div class="kpi">${rows.length}</div></div><div><div class="muted">Extraction</div><div style="margin-top:8px"><span class="pill neutral">${esc(r.extraction_status||"unknown")}</span></div></div></div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Test</th><th>Category</th><th>Value</th><th>Unit</th><th>Reference</th><th>Flag</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.test_name)}</td><td>${esc(x.category||"")}</td><td>${esc(fmt(x.value_numeric))}</td><td>${esc(x.unit||"")}</td><td>${x.reference_low!==null||x.reference_high!==null?esc(`${fmt(x.reference_low)} – ${fmt(x.reference_high)}`):"Not saved"}</td><td>${esc(x.flag||"")}</td></tr>`).join("")||'<tr><td colspan="6">No saved values.</td></tr>'}</tbody></table></div>${r.google_drive_url?`<div class="actions"><button class="primary" onclick="window.open('${esc(r.google_drive_url)}','_blank')">Open original in Google Drive</button></div>`:""}</section></div>`);document.getElementById("closedetail").onclick=()=>document.getElementById("detail").remove()}
function uploadSection(){return `<section class="card"><div class="section-title"><div><h2>⬆️ Upload New Report</h2><div class="muted">PDF, JPG or PNG. Original → private Drive → extraction/OCR → review → database.</div></div></div><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png"><div class="actions" style="justify-content:flex-start"><button class="primary" id="uploadBtn" disabled>Upload & Extract Report</button></div><div id="upstatus" class="status">Ready. Select a report above.</div></section>`}
function setTab(t){state.tab=t;renderDashboard()};function setCategory(c){state.category=c;state.tab="results";renderDashboard()}
function tabContent(){if(state.tab==="overview")return overview()+timeline();if(state.tab==="results")return resultsTab();if(state.tab==="trends")return trendsTab();if(state.tab==="insights")return `<section class="card"><div class="section-title"><div><h2>💡 Insights</h2><div class="muted">Rule-based observations generated from your saved measurements. They are not medical diagnoses.</div></div></div>${insightsHtml().join("")}</section>`+timeline();return reportsTab()}
function renderDashboard(){const tabs=["overview","results","trends","insights","reports"];root.innerHTML=`<header><div><h1>Harsha Health Vault</h1><p>Private • authenticated account</p></div><div class="top-actions"><button class="light" id="settings">Drive Setup</button><button class="light" id="logout">Logout</button></div></header><main class="wrap"><div class="tabs">${tabs.map(t=>`<button class="light tab ${state.tab===t?"active":""}" onclick="setTab('${t}')">${t==="overview"?"🏠 Overview":t==="results"?"🧪 Results":t==="trends"?"📈 Trends":t==="insights"?"💡 Insights":"📋 Reports"}</button>`).join("")}</div>${uploadSection()}${tabContent()}<div class="footer-note">🔒 Privacy: the web app is public, but your health records are queried only after authentication and protected by Supabase Row Level Security. Keep your Google Drive Health Vault folder private. Automated insights are informational and should not replace clinical advice.</div></main>`;
  document.getElementById("logout").onclick=()=>sb.auth.signOut();document.getElementById("settings").onclick=settings;
  const input=document.getElementById("file"),btn=document.getElementById("uploadBtn"),st=document.getElementById("upstatus");
  input.onchange=()=>{const f=input.files?.[0];btn.disabled=!f;if(f)st.textContent=`Selected: ${f.name} (${(f.size/1024/1024).toFixed(2)} MB). Tap Upload & Extract Report.`};
  btn.onclick=async()=>{const f=input.files?.[0];if(!f)return;btn.disabled=true;btn.textContent="Uploading…";try{await processFile(f,st)}catch(err){st.innerHTML='<span class="error">'+esc(err.message)+"</span>";btn.disabled=false}finally{if(document.getElementById("uploadBtn"))document.getElementById("uploadBtn").textContent="Upload & Extract Report"}};
}
async function app(){currentSession=await getSession();if(!currentSession){loginView();return}try{state.reports=await reports();state.results=await results();renderDashboard()}catch(e){root.innerHTML=`<main class="wrap"><section class="card"><h2>Health Vault</h2><p class="error">${esc(e.message)}</p><button class="light" onclick="app()">Retry</button></section></main>`}}
sb.auth.onAuthStateChange(()=>setTimeout(app,0));app();
</script>
</body></html>
