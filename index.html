<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsha Health Vault</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#111827;color:#fff;padding:22px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.72;font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:19px;margin-bottom:16px;box-shadow:0 6px 25px #0000000a}
.kpi{font-size:28px;font-weight:800;margin-top:6px}.muted{color:#667085;font-size:13px}
button{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}.light{background:#eef2f7;color:#172033}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);text-align:center;padding:38px}.logo{width:62px;height:62px;border-radius:17px;background:#111827;color:#fff;display:grid;place-items:center;margin:auto;font-weight:900;font-size:20px}
.login button{width:100%;margin-top:18px}.status{padding:11px;border-radius:11px;background:#f8fafc;margin-top:12px;font-size:13px}
input[type=file]{width:100%;padding:12px;border:1px dashed #cbd5e1;border-radius:11px;background:#fafcff}
article{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-top:1px solid #edf0f3}
.badge{font-size:11px;background:#ecfdf3;color:#027a48;padding:5px 8px;border-radius:20px;font-weight:800}.error{color:#b42318}
.hidden{display:none}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.modal .card{width:min(500px,100%)}.modal input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin:7px 0 14px}
@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL="https://dootskjesnsvovtjzvhn.supabase.co";
const SUPABASE_KEY="sb_publishable_6qIdrt7MBTzdu_ArPOYolA_RzSZDZMM";
const DRIVE_FOLDER_ID="1ZOkPEF6oh79ZVmMIcCxamHot41AVJmWR";
const DRIVE_FUNCTION=SUPABASE_URL+"/functions/v1/drive-upload-report";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("root");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const getClientId=()=>localStorage.getItem("hhv_google_client_id")||"";

async function login(){
 const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href.split("#")[0]}}); if(error) alert(error.message);
}
async function reports(){
 const {data,error}=await sb.from("health_reports").select("*").order("report_date",{ascending:false});
 if(error) throw error; return data||[];
}
function loginView(){
 root.innerHTML=`<main class="login"><section class="card"><div class="logo">HV</div><h1>Harsha Health Vault</h1><p class="muted">Private lab-report dashboard</p><button class="primary" id="login">Continue with Google</button><div class="status">🔒 Your health records are loaded only after authentication.</div></section></main>`;
 document.getElementById("login").onclick=login;
}
async function getDriveToken(){
 const clientId=getClientId();
 if(!clientId){settings();throw new Error("Add your Google OAuth Client ID in Settings first.");}
 return new Promise((resolve,reject)=>{
  const tokenClient=google.accounts.oauth2.initTokenClient({
   client_id:clientId,
   scope:"https://www.googleapis.com/auth/drive.file",
   callback:r=>r.error?reject(new Error(r.error_description||r.error)):resolve(r.access_token)
  });
  tokenClient.requestAccessToken({prompt:"consent"});
 });
}
async function upload(file){
 const {data:{session}}=await sb.auth.getSession();
 if(!session) throw new Error("Please log in again.");
 const token=await getDriveToken();
 const fd=new FormData(); fd.append("file",file); fd.append("google_access_token",token); fd.append("folder_id",DRIVE_FOLDER_ID);
 const res=await fetch(DRIVE_FUNCTION,{method:"POST",headers:{Authorization:"Bearer "+session.access_token},body:fd});
 const data=await res.json(); if(!res.ok) throw new Error(data.error||"Drive upload failed");
 return data;
}
function settings(){
 const existing=esc(getClientId());
 root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><section class="card"><h2>Google Drive Setup</h2><p class="muted">Paste the <b>OAuth Client ID</b> you created in Google Cloud. Never paste the Client Secret here.</p><input id="cid" value="${existing}" placeholder="xxxx.apps.googleusercontent.com"><button class="primary" id="save">Save</button> <button class="light" id="close">Cancel</button></section></div>`);
 document.getElementById("save").onclick=()=>{localStorage.setItem("hhv_google_client_id",document.getElementById("cid").value.trim());document.getElementById("modal").remove();alert("Google Client ID saved on this device.");};
 document.getElementById("close").onclick=()=>document.getElementById("modal").remove();
}
async function app(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){loginView();return;}
 let rs=[];try{rs=await reports()}catch(e){root.innerHTML=`<main class="wrap"><section class="card"><h2>Health Vault</h2><p class="error">${esc(e.message)}</p></section></main>`;return;}
 const cur=rs.find(x=>x.is_current);
 root.innerHTML=`<header><div><h1>Harsha Health Vault</h1><p>Private • authenticated account</p></div><div class="top-actions"><button class="light" id="settings">Drive Setup</button><button class="light" id="logout">Logout</button></div></header>
 <main class="wrap">
 <div class="grid">
 <div class="card"><div class="muted">Reports</div><div class="kpi">${rs.length}</div></div>
 <div class="card"><div class="muted">Current report</div><div class="kpi">${esc(cur?.report_date||"—")}</div></div>
 <div class="card"><div class="muted">Original storage</div><div class="kpi">Google Drive</div></div>
 </div>
 <section class="card"><h2>Upload New Report</h2><p class="muted">PDF, JPG or PNG. The original is sent to your private Google Drive folder. Processing should be reviewed before values are saved.</p>
 <input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png"><div id="upstatus" class="status">No file selected.</div></section>
 <section class="card"><h2>Report History</h2>${rs.map(r=>`<article><div><strong>${esc(r.report_date)}</strong> ${r.is_current?'<span class="badge">CURRENT</span>':''}<br><span class="muted">${esc(r.provider||"Provider not recorded")}</span></div><span class="muted">${esc(r.extraction_status||"pending")}</span></article>`).join("")||"<p class='muted'>No reports yet.</p>"}</section>
 </main>`;
 document.getElementById("logout").onclick=()=>sb.auth.signOut();
 document.getElementById("settings").onclick=settings;
 document.getElementById("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const st=document.getElementById("upstatus");
  st.textContent="Uploading securely to Google Drive…";
  try{const d=await upload(f);st.textContent="Uploaded to Google Drive: "+(d.file?.name||f.name)+". Automatic extraction/review is the next processing step.";setTimeout(app,1200);}
  catch(err){st.innerHTML='<span class="error">'+esc(err.message)+"</span>";}
 };
}
sb.auth.onAuthStateChange(()=>app());app();
</script>
</body>
</html>
